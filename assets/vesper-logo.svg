<svg xmlns="http://www.w3.org/2000/svg" width="480" height="140" viewBox="0 0 480 140">
  <!-- VESPER wordmark — evening-star V, wide tracking, mint accent -->
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ad8c5"/>
      <stop offset="1" stop-color="#5fae9c"/>
    </linearGradient>
  </defs>
  <rect width="480" height="140" rx="18" fill="#121316"/>
  <!-- star glyph -->
  <g transform="translate(52,70)">
    <path d="M0,-26 L5,-5 L26,0 L5,5 L0,26 L-5,5 L-26,0 L-5,-5 Z" fill="url(#mint)"/>
    <circle r="3.2" fill="#121316"/>
  </g>
  <text x="104" y="80" font-family="Inter, 'Segoe UI', sans-serif" font-size="44"
        font-weight="600" letter-spacing="14" fill="#e9ebee">VESPER</text>
  <text x="107" y="104" font-family="Inter, 'Segoe UI', sans-serif" font-size="12"
        letter-spacing="6" fill="#989ea8">SABLE AUDIO</text>
</svg>
